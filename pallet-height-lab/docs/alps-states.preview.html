<!doctype html><html lang="ko"><meta charset="utf-8"><title>ALPS 검증 제어 · 상태 확인</title><style>:root{--color-ink:#e7ecef;--color-muted:#a5b3bf;--color-accent:#72c6b4;--color-rule:#35424c;--color-danger:#e99b8e;--font-mono:Consolas,monospace}body{background:#10191e;color:var(--color-ink);font:14px sans-serif;padding:24px}section{margin:12px 0}button{background:#1b282f;color:var(--color-ink);border:1px solid var(--color-rule);padding:12px}button:hover,button.is-hover{border-color:var(--color-accent)}button:focus-visible,button.is-focus{outline:2px solid var(--color-accent);outline-offset:2px}button:active,button.is-active{transform:translateY(1px)}button:disabled{opacity:.4}[data-state=loading],[data-state=success]{color:var(--color-accent)}[data-state=error]{color:var(--color-danger)}span{display:inline-block;width:100px}</style><h1>ALPS 제어 상태 확인</h1><section><span>기본</span><button>비교 실행</button></section><section><span>Hover</span><button class="is-hover">비교 실행</button></section><section><span>Focus</span><button class="is-focus">비교 실행</button></section><section><span>Active</span><button class="is-active">비교 실행</button></section><section><span>Disabled</span><button disabled>비교 실행</button></section><section data-state="loading"><span>Loading</span>실험 3/60 계산 중…</section><section data-state="error"><span>Error</span>시간 예산 초과 · 점수화하지 않음</section><section data-state="success"><span>Success</span>실험 완료 · 검증 범위를 확인하세요</section></html>
