<div id="alps-benchmark">
  <h2>기본 적재 성능 비교</h2>
  <div class="viz-row">
    <span id="ab-sample" class="text-muted"></span>
    <span class="text-muted">높이 1,200mm · 30개 · MCTS 제외</span>
  </div>
  <div class="viz-controls" role="group" aria-label="표본 범위">
    <button type="button" class="btn" id="ab-all" aria-pressed="true">전체 100회</button>
    <button type="button" class="btn" id="ab-half" aria-pressed="false">첫 50회 · 탐색 비교</button>
  </div>
  <div class="viz-row ab-legend">
    <span><i class="ab-swatch ab-tetris"></i>ALPS Tetris</span>
    <span><i class="ab-swatch ab-cluster"></i>ALPS 군집</span>
    <span><i class="ab-swatch ab-base"></i>비교 정책</span>
  </div>
  <div class="ab-grid" id="ab-panels"></div>
  <h3>ALPS Tetris − Compact · 공급 부피 적재율</h3>
  <div id="ab-effects" aria-live="polite"></div>
  <div class="text-small text-muted">오차선: 공급 부피 적재 비율 평균의 95% 신뢰구간 · 사용 높이 채움률과 수직 공극 별도 표시</div>
  <div class="text-small text-muted">참고 점수: 적재 60 · 바닥 15 · SKU 접촉 15 · 기한 준수 10. 채택 순위 판정에 사용하지 않음.</div>
  <div class="text-small text-muted">병렬 4개 프로세스의 관측 지연 · 합성 입력 · 사전 고정 참고 점수</div>
</div>
<style>
#alps-benchmark .ab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin:16px 0 24px}
#alps-benchmark .ab-legend{gap:16px;margin-top:12px}
#alps-benchmark .ab-legend>span{display:inline-flex;gap:6px;align-items:center}
#alps-benchmark .ab-swatch{display:inline-block;width:12px;height:8px}
#alps-benchmark .ab-tetris{background:var(--viz-series-1)}
#alps-benchmark .ab-cluster{background:var(--viz-series-2)}
#alps-benchmark .ab-base{background:color-mix(in srgb,var(--foreground) 40%,transparent)}
#alps-benchmark .ab-row{margin:15px 0}
#alps-benchmark .ab-label{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#alps-benchmark .ab-track{height:10px;position:relative;background:color-mix(in srgb,var(--foreground) 7%,transparent);margin:7px 0}
#alps-benchmark .ab-bar{height:100%;transition:width .24s ease}
#alps-benchmark .ab-ci{position:absolute;top:4px;height:2px;background:var(--foreground)}
#alps-benchmark .ab-ci:before,#alps-benchmark .ab-ci:after{content:"";position:absolute;top:-3px;height:8px;width:1px;background:var(--foreground)}
#alps-benchmark .ab-ci:before{left:0}
#alps-benchmark .ab-ci:after{right:0}
#alps-benchmark .ab-axis{display:flex;justify-content:space-between;color:var(--muted-foreground);margin-top:8px}
#alps-benchmark .ab-detail{display:flex;flex-wrap:wrap;gap:3px 12px}
#alps-benchmark .ab-detail span{white-space:nowrap}
#alps-benchmark .ab-effect-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;margin:10px 0}
@media(max-width:650px){#alps-benchmark .ab-grid{grid-template-columns:1fr;gap:14px}}
@media(prefers-reduced-motion:reduce){#alps-benchmark .ab-bar{transition:none}}
</style>
<script>
(() => {
  const root=document.getElementById('alps-benchmark');
  const DATA=__BENCHMARK_DATA__;
  const names={'blb':'Bottom-Left-Back','capacity-compact':'Compact','strategy-greedy':'Greedy','lookahead':'Lookahead','future-hybrid':'Future Hybrid','floor-dense':'ALPS Tetris','cluster-layer':'ALPS 군집'};
  let sample=window.openai?.widgetState?.modelContent?.sample===50?50:100;
  const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
  const number=(v,d=1)=>v===null||v===undefined?'—':Number(v).toFixed(d);
  const draw=()=>{
    const data=DATA[String(sample)];
    root.querySelector('#ab-all').setAttribute('aria-pressed',String(sample===100));
    root.querySelector('#ab-half').setAttribute('aria-pressed',String(sample===50));
    root.querySelector('#ab-sample').textContent=`조건별 ${sample}개 입고 순서 · ${data.trials.toLocaleString()}회${sample===50?' · 중간 표본 탐색':''}`;
    const panels=root.querySelector('#ab-panels');panels.replaceChildren();
    for(const condition of data.conditions){
      const panel=make('section');panel.append(make('h3',null,condition.label));
      panel.append(make('div','text-small text-muted','공급 부피 적재 비율 · 기본 적재 지표 우선'));
      for(const row of condition.rows){
        const item=make('div','ab-row');
        const label=make('div','ab-label');label.append(make('span',null,names[row.algorithm]));label.append(make('span','tabular-nums',`${number(row.acceptance)}% · ${number(row.count)}/30개`));item.append(label);
        const track=make('div','ab-track');track.setAttribute('role','img');track.setAttribute('aria-label',`${names[row.algorithm]} 공급 부피 적재 비율 ${number(row.acceptance)}%, 95% 신뢰구간 ${number(row.acceptanceCi[0])}~${number(row.acceptanceCi[1])}`);
        track.setAttribute('data-tooltip',`${names[row.algorithm]} · n=${row.n} · 적재 ${number(row.acceptance,2)}% · 95% CI [${number(row.acceptanceCi[0],2)}, ${number(row.acceptanceCi[1],2)}]`);
        const bar=make('div',`ab-bar ${row.algorithm==='floor-dense'?'ab-tetris':row.algorithm==='cluster-layer'?'ab-cluster':'ab-base'}`);bar.style.width=`${row.acceptance}%`;track.append(bar);
        const ci=make('div','ab-ci');ci.style.left=`${Math.max(0,row.acceptanceCi[0])}%`;ci.style.width=`${Math.min(100,row.acceptanceCi[1])-Math.max(0,row.acceptanceCi[0])}%`;track.append(ci);item.append(track);
        const details=make('div','ab-detail text-small tabular-nums');
        for(const text of [`사용 높이 채움 ${number(row.envelopeFill)}%`,`수직 공극 ${number(row.columnVoidLiters,2)}L`,`높이 ${number(row.usedHeightMm,0)}mm`,`SKU 접촉 ${number(row.cluster)}%`,`P95 ${number(row.p95,0)}ms`,`참고 ${number(row.score)}점`])details.append(make('span',null,text));item.append(details);panel.append(item);
      }
      const axis=make('div','ab-axis text-small tabular-nums');for(const t of ['0','50','100%'])axis.append(make('span',null,t));panel.append(axis);panels.append(panel);
    }
    const effects=root.querySelector('#ab-effects');effects.replaceChildren();
    for(const e of data.effects){const row=make('div','ab-effect-row');row.append(make('span',null,e.label));row.append(make('span','tabular-nums',`${e.delta>=0?'+':''}${number(e.delta,2)}%p · 보정 95% CI [${number(e.low,2)}, ${number(e.high,2)}]`));effects.append(row);}
  };
  const choose=(n)=>{sample=n;draw();window.openai?.setWidgetState?.({modelContent:{sample:n},privateContent:null}).catch(()=>{});};
  root.querySelector('#ab-all').addEventListener('click',()=>choose(100));root.querySelector('#ab-half').addEventListener('click',()=>choose(50));
  window.addEventListener('openai:set_globals',event=>{const n=event.detail?.globals?.widgetState?.modelContent?.sample;if(n===50||n===100){sample=n;draw();}});
  draw();
})();
</script>
